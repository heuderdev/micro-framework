server {
    listen 1900;
    listen [::]:1900;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/javascript application/javascript text/markdown;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript text/markdown image/svg+xml;

    # documentação técnica interna (doc.html)
    location = /tecnica {
        include /etc/nginx/conf.d/docs-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files /tecnica.html =404;
    }
    location = /doc.html {
        return 301 /tecnica;
    }

    # guias em Markdown (docs/*.md): exibidos como texto, não baixados
    location ~* \.md$ {
        include /etc/nginx/conf.d/docs-headers.inc;
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    # CSS/JS: cache curto (os nomes não têm hash)
    location /assets/ {
        include /etc/nginx/conf.d/docs-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        include /etc/nginx/conf.d/docs-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
